<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Photo library – Mìn Thích Làm Vlog">Thư viện ảnh – Mìn Thích Làm Vlog</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d1514">
  <link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/lang.js"></script>
  <script src="js/session.js" defer></script>
</head>
<body class="night">
  <a class="skip" href="#main" data-en="Skip to content">Chuyển đến nội dung</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html">
        <img class="brand__mark" src="images/logo-96.png" alt="" width="44" height="44">
        <span class="brand__name">Mìn Thích Làm Vlog</span>
      </a>
      <nav class="nav" aria-label="Menu chính" data-en-aria-label="Main menu">
        <a href="index.html#nhat-ky" data-en="Journal">Nhật ký</a>
        <a href="about.html" data-en="About">Giới thiệu</a>
        <a class="nav-account" href="dang-nhap.html" data-en="Log in">Đăng nhập</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Ngôn ngữ" data-en-aria-label="Language">
        <button type="button" data-set-lang="vi" aria-pressed="true" lang="vi" aria-label="Tiếng Việt">VI</button>
        <button type="button" data-set-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <main id="main" class="gallery-page">
    <section class="gallery-hero">
      <div class="wrap">
        <p class="gallery-kicker" data-en="Library">Thư viện</p>
        <h1 class="gallery-title"><span data-en="Photos for the">Ảnh cho</span> <span data-en="journal">nhật ký</span></h1>
        <p class="gallery-lede" data-en="Upload a photo, copy its link, and paste it into a post.">Tải ảnh lên, sao chép liên kết và dán vào bài viết.</p>
      </div>
    </section>

    <div class="wrap gallery">
      <p id="gallery-msg" class="notice gallery-notice" role="status" hidden></p>
      <noscript><p class="notice notice--error" data-en="JavaScript is needed here.">Cần bật JavaScript để dùng thư viện ảnh.</p></noscript>

      <div id="gallery-root" hidden>
        <section class="uploader" aria-labelledby="upload-title">
          <h2 id="upload-title" class="gallery-h2" data-en="Upload">Tải ảnh lên</h2>
          <form id="upload-form" class="uploader__form" novalidate>
            <label class="dropzone" id="dropzone" for="file-input">
              <span class="dropzone__icon" aria-hidden="true">+</span>
              <span class="dropzone__text" data-en="Choose a photo or drop it here">Chọn ảnh hoặc kéo thả vào đây</span>
              <span class="dropzone__hint" data-en="JPEG, PNG or WebP. Photos are resized and compressed automatically.">JPEG, PNG hoặc WebP. Ảnh sẽ tự thu nhỏ và nén.</span>
              <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" class="visually-hidden">
            </label>
            <div id="preview" class="preview" hidden>
              <img id="preview-img" alt="" width="240" height="160">
              <p id="preview-info" class="muted"></p>
            </div>
            <div class="field">
              <label for="caption" data-en="Caption (optional)">Chú thích (không bắt buộc)</label>
              <input id="caption" name="caption" type="text" maxlength="200" placeholder="Ví dụ: Bình minh ở Hạ Long">
            </div>
            <div class="form-actions">
              <button type="submit" id="upload-btn" class="btn btn--primary" disabled data-en="Upload">Tải lên</button>
            </div>
          </form>
        </section>

        <section aria-labelledby="library-title">
          <div class="gallery-head">
            <h2 id="library-title" class="gallery-h2" data-en="All photos">Tất cả ảnh</h2>
            <span id="count" class="muted"></span>
          </div>
          <ul id="image-grid" class="image-grid"></ul>
          <p id="empty" class="muted" data-en="No photos yet." hidden>Chưa có ảnh nào.</p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p data-en="© 2026 Mìn Thích Làm Vlog">© 2026 Mìn Thích Làm Vlog</p>
    </div>
  </footer>

  <script src="js/ui.js" defer></script>
  <script src="js/photo.js"></script>
  <script src="js/gallery.js" defer></script>
</body>
</html>
