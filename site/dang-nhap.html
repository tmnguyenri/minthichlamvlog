<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Log in – Mìn Thích Làm Vlog">Đăng nhập – Mìn Thích Làm Vlog</title>
  <meta name="description" content="Đăng nhập để bình luận và theo dõi Mìn Thích Làm Vlog." data-en-content="Log in to comment and follow Mìn Thích Làm Vlog.">
  <meta property="og:title" content="Đăng nhập – Mìn Thích Làm Vlog">
  <meta property="og:description" content="Đăng nhập để bình luận và theo dõi Mìn Thích Làm Vlog.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/lang.js"></script>
  <script src="js/session.js" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-en="Skip to content">Chuyển đến nội dung</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="index.html">
        <img class="brand__mark" src="favicon.svg" alt="" width="40" height="40">
        <span class="brand__name">Mìn Thích Làm Vlog</span>
      </a>
      <nav class="nav" aria-label="Menu chính" data-en-aria-label="Main menu">
        <a href="index.html#nhat-ky" data-en="Journal">Nhật ký</a>
        <a href="index.html#ban-do" data-en="Atlas">Bản đồ</a>
        <a href="about.html" data-en="About">Giới thiệu</a>
        <a class="nav-account" href="dang-nhap.html" data-en="Log in">Đăng nhập</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Ngôn ngữ" data-en-aria-label="Language">
        <button type="button" data-set-lang="vi" aria-pressed="true" lang="vi" aria-label="Tiếng Việt">VI</button>
        <button type="button" data-set-lang="en" aria-pressed="false" lang="en" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="wrap">
        <h1 class="page-title"><span data-en="Welcome">Chào mừng</span> <span data-en="back">trở lại</span></h1>
      </div>
    </section>
    <div class="wrap auth">
      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label for="email" data-en="Email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
        </div>
        <div class="field">
          <label for="password" data-en="Password">Mật khẩu</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <p id="form-msg" class="notice" role="alert" hidden></p>
        <button class="btn btn--primary" type="submit" data-en="Log in">Đăng nhập</button>
        <p class="form-alt"><span data-en="No account yet?">Chưa có tài khoản?</span> <a href="dang-ky.html" data-en="Sign up">Đăng ký</a></p>
      </form>
      <noscript><p class="notice notice--error" data-en="JavaScript is needed to log in.">Cần bật JavaScript để đăng nhập.</p></noscript>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p data-en="© 2026 Mìn Thích Làm Vlog">© 2026 Mìn Thích Làm Vlog</p>
      <ul class="footer-nav">
        <li><a href="index.html#nhat-ky" data-en="Journal">Nhật ký</a></li>
        <li><a href="index.html#ban-do" data-en="Atlas">Bản đồ</a></li>
        <li><a href="about.html" data-en="About">Giới thiệu</a></li>
        <li><a href="about.html#lien-he" data-en="Contact">Liên hệ</a></li>
        <li><a href="rieng-tu.html" data-en="Privacy">Quyền riêng tư</a></li>
      </ul>
    </div>
  </footer>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
